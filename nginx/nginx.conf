# 本番用。/ はビルド済みの React、/api・/admin・/static・/ws は backend（Uvicorn）へ振り分ける。
# TLS は前段の ALB（ACM 証明書）で終端する想定。

# WebSocket のアップグレード用: Upgrade ヘッダがあれば "upgrade"、なければ "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ALB が付けた X-Forwarded-Proto（https）を引き継ぐ。ALB を経由しない場合は自分のスキームを使う
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ファイルは S3 に直接アップロードするので、API が受け取るのは小さな JSON だけ
    client_max_body_size 1m;

    # ---- WebSocket ----
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;                          # WebSocket には HTTP/1.1 が必須
        proxy_set_header Upgrade $http_upgrade;          # hop-by-hop ヘッダなので明示的に中継する
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;                     # Origin 検証と ALLOWED_HOSTS のため
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;                         # クライアントは 25 秒ごとに ping するので十分
        proxy_send_timeout 120s;
    }

    # ---- REST API・管理画面・管理画面の静的ファイル ----
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                  # upstream の keepalive を使う
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---- フロントエンド（SPA）----
    root /usr/share/nginx/html;

    # Vite が出力するファイル名にはハッシュが付くので、長期キャッシュしてよい
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /rooms/42 のようなクライアント側のルートでは、index.html を返して React Router に任せる
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
